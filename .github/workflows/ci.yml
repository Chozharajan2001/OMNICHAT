name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, complexity, and hook checks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Normal ESLint and per-function complexity regressions
        run: pnpm quality:check
      - name: Prisma schema drift check
        run: pnpm db:drift-check
      - name: Staged snapshot and hook behavior tests
        run: pnpm quality:test

  test-and-typecheck:
    name: Tests and TypeScript
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: file:./test.db
      AUTH_SECRET: ci-auth-secret-not-for-production
      ENCRYPTION_SECRET_KEY: ci-encryption-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: test-and-typecheck
    env:
      DATABASE_URL: file:./test.db
      AUTH_SECRET: ci-auth-secret-not-for-production
      ENCRYPTION_SECRET_KEY: ci-encryption-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
