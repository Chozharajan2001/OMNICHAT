# OmniChat CI (repository root = omnichat/)
# The previous copy of this workflow only listened for `main`/`develop`
# while the default branch is `master`, so it never ran; it also pinned
# Node 20/pnpm 9 while the project requires Node 22/pnpm 11.8, and it
# never built the Docker image that production deploys use.

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, complexity, and hook checks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Normal ESLint and per-function complexity regressions
        run: pnpm quality:check
      - name: Prisma schema drift check
        run: pnpm db:drift-check
      - name: Staged snapshot and hook behavior tests
        run: pnpm quality:test

  test-and-typecheck:
    name: Tests and TypeScript
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: file:./test.db
      AUTH_SECRET: ci-auth-secret-not-for-production
      ENCRYPTION_SECRET_KEY: ci-encryption-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test

  build:
    # Both operating systems: the standalone tracer resolves native bindings
    # per platform, and the Windows leg is where a skipped @libsql package
    # first shows up. `prebuild` stubs them (scripts/fixup-native-stubs.mjs);
    # this matrix is what keeps that claim honest instead of documented.
    name: Production build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: test-and-typecheck
    env:
      DATABASE_URL: file:./test.db
      AUTH_SECRET: ci-auth-secret-not-for-production
      ENCRYPTION_SECRET_KEY: ci-encryption-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build

  docker:
    name: Docker images and compose validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build the slim runtime image (validates Dockerfile end-to-end)
        run: docker build --target runner -t omnichat-runner:ci .
      - name: Build the one-shot migrate image (compose provisioning path)
        run: docker build --target migrate -t omnichat-migrate:ci .
      - name: Validate both compose stacks (migrate wiring included)
        run: |
          POSTGRES_USER=u POSTGRES_PASSWORD=p \
          AUTH_SECRET=a-very-long-ci-only-secret \
          ENCRYPTION_SECRET_KEY=ci-encryption-secret-not-for-production \
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.sqlite.yml config --quiet

  security-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Advisory by design: a newly disclosed advisory should not red-line
      # unrelated PRs, but the result must be visible on every run.
      - name: pnpm audit (high and above)
        run: pnpm audit --audit-level=high
        continue-on-error: true
