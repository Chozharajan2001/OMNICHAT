# OmniChat Render Deployment Configuration
# https://render.com/docs/blueprint-spec

services:
  # Web Service - OmniChat Application
  - type: web
    name: omnichat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omnichat-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET_KEY
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://omnichat.onrender.com
      # Render runs one web instance, so the in-memory limiter is sufficient.
      # Production otherwise resolves to redis-rest and fails closed without
      # Upstash credentials - which would refuse every sign-in. Set
      # RATE_LIMIT_BACKEND=redis-rest plus the UPSTASH_* vars only for a
      # multi-instance plan.
      - key: RATE_LIMIT_BACKEND
        value: memory

# PostgreSQL Database
databases:
  - name: omnichat-db
    plan: starter
    user: omnichat
