# OmniChat Render Deployment Configuration
# https://render.com/docs/blueprint-spec

services:
  # Web Service - OmniChat Application
  - type: web
    name: omnichat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omnichat-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET_KEY
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://omnichat.onrender.com

# PostgreSQL Database
databases:
  - name: omnichat-db
    plan: starter
    user: omnichat
